<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon</title>
  <style>
:root {
  --bg: #f5efe4;
  --surface: #fbf8f1;
  --surface-alt: #ede5d6;
  --border: #ddd3c2;
  --border-strong: #c8bca8;
  --ink: #231e18;
  --muted: #6e6150;
  --soft: #968773;
  --danger: #b93a2e;
  --ok: #466958;
  --amber-bg: #fbf0d9;
  --amber-border: #d9b874;
  --amber-ink: #5d400e;
  --radius: 4px;
  --serif: Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  line-height: 1.45;
}

.hidden {
  display: none !important;
}

button,
label.text-btn {
  font-family: inherit;
  cursor: pointer;
}

button:focus-visible,
a:focus-visible,
select:focus-visible,
textarea:focus-visible,
input:focus-visible,
label.text-btn:focus-within {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}

.shell {
  max-width: 960px;
  margin: 0 auto;
  padding: 16px 18px 48px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Top Bar */
.topbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.topbar-left {
  display: flex;
  align-items: baseline;
  gap: 9px;
  flex-wrap: wrap;
}

.topbar h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.sep {
  color: var(--border-strong);
}

.meta-mono {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.storage-tag {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 3px;
  padding: 1px 6px;
}

.storage-tag.is-linked {
  color: var(--ok);
  border-color: #b7cbbd;
  background: #eff5f0;
}

.reconnect-btn {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--amber-ink);
  background: var(--amber-bg);
  border: 1px solid var(--amber-border);
  border-radius: 3px;
  padding: 2px 8px;
  transition: background 0.12s ease;
}

.reconnect-btn:hover {
  background: #f6e4be;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.text-btn {
  background: none;
  border: none;
  padding: 2px 4px;
  font-size: 12px;
  color: var(--muted);
}

.text-btn:hover {
  color: var(--ink);
  text-decoration: underline;
}

/* Conflict & Import Paper Banners */
.paper-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 7px 11px;
  border-radius: var(--radius);
  font-size: 12px;
}

.conflict-banner {
  background: var(--amber-bg);
  border: 1px solid var(--amber-border);
  color: var(--amber-ink);
}

.import-banner {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  color: var(--ink);
}

.banner-msg {
  font-weight: 600;
}

.banner-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.banner-btn {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  padding: 3px 9px;
  font-size: 11.5px;
  font-weight: 500;
}

.banner-btn:hover {
  background: var(--surface-alt);
}

.banner-btn.is-primary {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}

.banner-btn.is-primary:hover {
  background: #3b3329;
}

.banner-btn.is-danger {
  background: var(--danger);
  color: #fdfaf4;
  border-color: var(--danger);
}

.banner-btn.is-danger:hover {
  filter: brightness(0.93);
}

/* Capture Bar */
.capture-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 7px;
  flex-wrap: wrap;
  transition: border-color 0.12s ease, box-shadow 0.12s ease;
}

.capture-bar:focus-within {
  border-color: var(--ink);
  box-shadow: 0 0 0 2px rgba(35, 30, 24, 0.1);
}

.capture-input {
  flex: 1 1 220px;
  min-width: 0;
  border: none;
  background: transparent;
  padding: 4px 6px;
  font-size: 13px;
  color: var(--ink);
  outline: none;
}

.capture-input:focus-visible {
  outline: none;
}

.capture-input::placeholder {
  color: var(--soft);
  font-style: italic;
}

.quick-date-pills {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.quick-pill {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 6px;
  line-height: 1.3;
}

.quick-pill:hover {
  background: var(--surface-alt);
  color: var(--ink);
  border-color: var(--border-strong);
}

.quick-pill.is-active {
  background: var(--surface-alt);
  color: var(--ink);
  border-color: var(--ink);
  font-weight: 600;
}

.capture-date {
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 6px;
  outline: none;
}

.capture-date:focus {
  border-color: var(--ink);
  color: var(--ink);
}

.capture-check {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
  padding: 3px 6px;
  border-radius: 3px;
  user-select: none;
}

.capture-check:hover {
  background: var(--surface-alt);
  color: var(--ink);
}

.capture-check input {
  margin: 0;
  accent-color: var(--danger);
}

.btn-add {
  background: var(--ink);
  color: #fbf8f1;
  border: 1px solid var(--ink);
  border-radius: 3px;
  padding: 4px 13px;
  font-size: 12px;
  font-weight: 600;
}

.btn-add:hover {
  background: #3b3329;
}

/* Lightweight Search & #Tag Filter Bar */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  min-height: 26px;
}

.search-box {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 196px;
  max-width: 100%;
}

.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 22px 3px 8px;
  font-size: 12px;
  color: var(--ink);
  outline: none;
}

.search-input::placeholder {
  color: var(--soft);
  font-style: italic;
}

.search-input:focus {
  border-color: var(--border-strong);
  background: #fffdf9;
}

.search-clear-btn {
  position: absolute;
  right: 3px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  padding: 2px 5px;
  border-radius: 2px;
}

.search-clear-btn:hover {
  color: var(--ink);
  background: var(--surface-alt);
}

.tag-chips {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
}

.tag-chip {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 1px 8px;
  line-height: 1.4;
}

.tag-chip:hover {
  color: var(--ink);
  border-color: var(--border-strong);
  background: var(--surface-alt);
}

.tag-chip.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
  font-weight: 600;
}

.clear-filters-btn {
  font-size: 11px;
  margin-left: auto;
}

/* Warm Paper Editorial Blocks */
.block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 14px;
}

.block-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--surface-alt);
  flex-wrap: wrap;
}

.block-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.block-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
}

.ok-text {
  color: var(--ok);
}

.nudge {
  font-size: 11.5px;
  font-style: italic;
  color: var(--soft);
}

.nudge.is-heavy {
  color: var(--danger);
  font-style: normal;
  font-weight: 600;
}

.section-foot {
  margin-top: 6px;
  padding-top: 4px;
  border-top: 1px dashed var(--surface-alt);
  display: flex;
  justify-content: flex-end;
}

.show-more-btn {
  font-family: var(--mono);
  font-size: 11px;
}

/* Paper Desk Horizon Header & Zoom Switcher */
.horizon-head-right {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.zoom-switcher {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px;
}

.zoom-btn {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  background: transparent;
  border: none;
  border-radius: 2px;
  padding: 1px 6px;
  line-height: 1.4;
}

.zoom-btn:hover {
  color: var(--ink);
}

.zoom-btn.active {
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  box-shadow: 0 0 0 1px var(--border-strong);
}

.legend {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--soft);
}

.legend-bar {
  width: 58px;
  height: 7px;
  border-radius: 2px;
  background: linear-gradient(
    to right,
    rgba(92, 118, 106, 0.1) 0%,
    rgba(168, 134, 58, 0.55) 55%,
    rgba(185, 58, 46, 0.98) 100%
  );
  border: 1px solid rgba(35, 30, 24, 0.12);
}

.overdue-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
  padding: 5px 8px;
  background: #f9eae7;
  border: 1px solid #e4bdb6;
  border-radius: 3px;
  font-size: 11.5px;
}

.overdue-label {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--danger);
}

.overdue-chip-group {
  display: inline-flex;
  align-items: stretch;
  border-radius: 2px;
  overflow: hidden;
  border: 1px solid rgba(138, 36, 28, 0.35);
}

.overdue-chip {
  background: var(--danger);
  color: #fdfaf4;
  border: none;
  border-radius: 0;
  padding: 2px 7px;
  font-size: 11.5px;
  font-weight: 500;
}

.overdue-chip:hover {
  filter: brightness(0.93);
}

.overdue-snooze-btn {
  background: #fdfaf4;
  color: var(--danger);
  border: none;
  border-left: 1px solid rgba(138, 36, 28, 0.25);
  padding: 2px 6px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
}

.overdue-snooze-btn:hover {
  background: #f5d6d0;
  color: #8a241c;
}

.timeline-scroll {
  overflow-x: auto;
}

.timeline-canvas {
  position: relative;
  min-width: 680px;
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 7px 9px 9px;
}

.timeline-axis {
  position: relative;
  height: 20px;
  border-bottom: 1px solid var(--border-strong);
  margin-bottom: 7px;
}

.month-marker {
  position: absolute;
  top: 0;
  height: 15px;
  padding-left: 5px;
  border-left: 1px solid var(--border-strong);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  display: flex;
  align-items: center;
  white-space: nowrap;
}

.month-marker.is-today {
  border-left: 2px solid var(--ink);
  color: var(--ink);
  font-weight: 700;
}

.timeline-grid {
  position: absolute;
  top: 27px;
  bottom: 7px;
  left: 9px;
  right: 9px;
  pointer-events: none;
}

.grid-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(35, 30, 24, 0.05);
}

.grid-line.is-major {
  background: rgba(35, 30, 24, 0.12);
}

.timeline-lanes {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 224px;
  overflow-y: auto;
  padding-right: 2px;
}

.timeline-lanes.is-expanded {
  max-height: none;
  overflow-y: visible;
}

.timeline-empty {
  color: var(--soft);
  font-style: italic;
  font-size: 12px;
  padding: 8px 4px;
}

.timeline-lane {
  position: relative;
  height: 22px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  overflow: hidden;
}

/* Watercolor wash fading left-to-right into a crisp solid right-edge deadline block */
.timeline-bar {
  position: relative;
  height: 20px;
  border-radius: 2px;
  border: none;
  border-right: 3px solid transparent;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 7px;
  flex-shrink: 0;
  max-width: 100%;
  overflow: hidden;
  transition: filter 0.1s ease;
}

.timeline-bar:hover {
  filter: brightness(0.94);
}

/* Calm ink outline for undated Today focus items (visually distinct from hard deadlines) */
.timeline-bar.is-focus-undated {
  background: var(--surface);
  border: 1.5px solid var(--ink);
  border-right: 3px solid var(--ink);
  color: var(--ink);
}

.timeline-bar.is-focus-undated:hover {
  filter: none;
  background: var(--surface-alt);
}

.timeline-bar-label {
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(100% - 76px);
}

.timeline-bar-meta {
  font-family: var(--mono);
  font-size: 10.5px;
  opacity: 0.9;
  margin-left: 6px;
  white-space: nowrap;
}

.timeline-outside-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: 7px;
  padding: 1px 5px;
  border: none;
  border-radius: 2px;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
  white-space: nowrap;
  min-width: 0;
  overflow: hidden;
}

.timeline-outside-label:hover {
  background: var(--surface-alt);
}

.timeline-outside-title {
  font-weight: 500;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.timeline-outside-meta {
  font-family: var(--mono);
  font-size: 10.5px;
  flex-shrink: 0;
  white-space: nowrap;
}

.timeline-outside-meta.is-focus-undated {
  color: var(--muted);
}

.timeline-beyond-note {
  position: relative;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 6px;
  padding-top: 5px;
  border-top: 1px dotted var(--border);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
}

.beyond-label {
  font-weight: 700;
  text-transform: uppercase;
  font-size: 10px;
  color: var(--muted);
  margin-right: 2px;
}

.beyond-chip {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 10.5px;
}

.beyond-chip:hover {
  background: var(--surface-alt);
  border-color: var(--border-strong);
}

/* Two-Column Layout */
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: start;
}

@media (max-width: 740px) {
  .columns {
    grid-template-columns: 1fr;
  }
}

.col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.filters {
  display: inline-flex;
  gap: 2px;
}

.filter-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 11.5px;
  padding: 2px 6px;
  border-radius: 3px;
}

.filter-btn:hover {
  color: var(--ink);
}

.filter-btn.active {
  background: var(--surface-alt);
  color: var(--ink);
  font-weight: 600;
}

/* Hairline-divided Notebook Rows */
.list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.task-item {
  border-top: 1px solid var(--surface-alt);
}

.task-item:first-child {
  border-top: none;
}

.task-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 4px;
  border-radius: 2px;
}

.task-row:hover {
  background: var(--bg);
}

.task-item.is-done .task-title {
  text-decoration: line-through;
  color: var(--soft);
}

.task-checkbox {
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: var(--ok);
  cursor: pointer;
  flex-shrink: 0;
}

.task-body {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}

.task-title {
  font-size: 13px;
  color: var(--ink);
  word-break: break-word;
  cursor: text;
}

.inline-title-input {
  flex: 1 1 160px;
  min-width: 0;
  font-family: inherit;
  font-size: 13px;
  color: var(--ink);
  background: #fffdf9;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  padding: 1px 6px;
  outline: none;
}

.inline-title-input:focus {
  border-color: var(--ink);
}

.due-tag {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 2px;
  white-space: nowrap;
}

.meta-pill {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 0 5px;
  line-height: 1.5;
  white-space: nowrap;
}

.meta-pill:hover {
  border-color: var(--border-strong);
  color: var(--ink);
  background: var(--surface-alt);
}

.meta-pill.is-complete {
  color: var(--ok);
  border-color: #b7cbbd;
  background: #eff5f0;
}

.done-date {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--soft);
}

.task-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
  opacity: 0.55;
  transition: opacity 0.12s ease;
}

.task-row:hover .task-actions,
.task-row:focus-within .task-actions,
.task-item.is-expanded .task-actions {
  opacity: 1;
}

.inline-date-input {
  font-family: var(--mono);
  font-size: 10.5px;
  border: 0 solid transparent;
  border-radius: 2px;
  padding: 0;
  color: var(--muted);
  background: transparent;
  width: 0;
  opacity: 0;
  overflow: hidden;
  pointer-events: none;
  transition: width 0.12s ease, opacity 0.12s ease;
}

.task-row:hover .inline-date-input,
.task-row:focus-within .inline-date-input,
.task-item.is-expanded .inline-date-input,
.inline-date-input:focus {
  width: 108px;
  opacity: 1;
  padding: 1px 4px;
  border-width: 1px;
  border-color: var(--border);
  background: var(--surface);
  pointer-events: auto;
}

@media (max-width: 520px) {
  .task-row {
    flex-wrap: wrap;
  }

  <script>
/**
 * logic.js — "The Kitchen"
 * Pure functions that handle dates, the zoomable timeline position,
 * the transparent-to-solid urgency gradient math, recurrence, tags,
 * quick-capture parsing and task normalization.
 *
 * Notice there is NO button or HTML code here — just clear rules
 * (Input -> Logic -> Output) so it is easy to read and test.
 */

const HORIZON_DAYS = 90; // 3 months zoomed out (default)
const VALID_RECURRENCES = ["", "weekly", "monthly", "quarterly", "yearly"];
const LOGIC_VALID_STATUSES = ["inbox", "today", "done"];
const LOGIC_DATE_KEY_PATTERN = /^\d{4}-\d{2}-\d{2}$/;

/**
 * Convert a Date object to local "YYYY-MM-DD" text (safe from timezone shifts).
 */
function toDateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

/**
 * Turn "YYYY-MM-DD" into a local midnight Date.
 */
function parseDateKey(dateKey) {
  if (!dateKey || typeof dateKey !== "string") return null;
  const parts = dateKey.split("-").map(Number);
  if (parts.length !== 3 || parts.some(Number.isNaN)) return null;
  return new Date(parts[0], parts[1] - 1, parts[2]);
}

/**
 * True only for real calendar dates written exactly as "YYYY-MM-DD".
 */
function logicIsValidDateKey(dateKey) {
  if (typeof dateKey !== "string" || !LOGIC_DATE_KEY_PATTERN.test(dateKey)) return false;
  const d = parseDateKey(dateKey);
  return !!d && toDateKey(d) === dateKey;
}

/**
 * Add (or subtract) whole days to a "YYYY-MM-DD" key. Returns "" if the key is invalid.
 */
function addDaysToKey(dateKey, deltaDays) {
  const d = parseDateKey(dateKey);
  if (!d || Number.isNaN(d.getTime())) return "";
  return toDateKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() + deltaDays));
}

/**
 * Add whole months to a date, clamping the day to the target month's last day.
 * `anchorDay` is the day-of-month we want to return to (so Jan 31 -> Feb 28 -> Mar 31).
 */
function logicAddMonthsClamped(year, monthIndex, anchorDay, months) {
  const total = year * 12 + monthIndex + months;
  const ny = Math.floor(total / 12);
  const nm = ((total % 12) + 12) % 12;
  const lastDay = new Date(ny, nm + 1, 0).getDate();
  return new Date(ny, nm, Math.min(anchorDay, lastDay));
}

/**
 * Whole calendar days between today and dueDateKey.
 * Negative = overdue, 0 = due today, positive = days left.
 */
function daysUntil(dueDateKey, today = new Date()) {
  const due = parseDateKey(dueDateKey);
  if (!due) return null;
  const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const msPerDay = 24 * 60 * 60 * 1000;
  return Math.round((due - startOfToday) / msPerDay);
}

/**
 * Human-friendly label like "Today", "Tomorrow", "In 12d", or "2d overdue".
 */
function formatDaysLabel(days) {
  if (days === null || days === undefined) return "";
  if (days < 0) return `${Math.abs(days)}d overdue`;
  if (days === 0) return "Today";
  if (days === 1) return "Tomorrow";
  return `In ${days}d`;
}

/**
 * Short readable date like "Dec 12".
 */
function formatShortDate(dateKey) {
  const d = parseDateKey(dateKey);
  if (!d) return "";
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

/**
 * Calculate the visual gradient style for a task based on how many days are left.
 *
 * How it works:
 * - "closeness" goes smoothly from 0 (horizonDays+ away) to 1 (due today or overdue).
 * - Far-away tasks start almost transparent and peak softly.
 * - Close tasks ramp into a rich, full solid color block so they naturally stand out.
 */
function getGradientStyle(daysLeft, horizonDays = HORIZON_DAYS) {
  const horizon = horizonDays > 0 ? horizonDays : HORIZON_DAYS;
  // Clamp daysLeft between 0 and horizon for smooth scaling
  const clamped = Math.max(0, Math.min(horizon, daysLeft));
  const closeness = 1 - clamped / horizon; // 0 = far away, 1 = due right now

  // Paper Desk watercolor palette:
  // Far (calm sage) -> Mid (warm ochre) -> Approaching (burnt sienna) -> Imminent (terracotta crimson)
  let rgb;
  let badgeDarken = 30;
  if (daysLeft < 0) {
    rgb = [168, 38, 32]; // Overdue deep brick
  } else if (daysLeft <= 3) {
    rgb = [185, 58, 46]; // Imminent terracotta red
  } else if (daysLeft <= 14) {
    rgb = [196, 108, 43]; // Approaching burnt sienna
  } else if (daysLeft <= 35) {
    rgb = [168, 134, 58]; // Mid-term warm ochre
    badgeDarken = 54; // Ochre is light: darken more so the badge text stays readable
  } else {
    rgb = [92, 118, 106]; // Long-term calm sage
  }

  const [r, g, b] = rgb;

  // Left edge of the bar: near-transparent watercolor wash; right edge: solid color cap
  const startAlpha = Number((0.03 + closeness * 0.34).toFixed(2));
  const endAlpha = Number((0.26 + closeness * 0.74).toFixed(2));

  // Keep dark ink on pale/mid washes; white text only on near-solid deep crimson/brick blocks
  const useLightText = daysLeft <= 3 && closeness >= 0.85;

  return {
    closeness: Number(closeness.toFixed(3)),
    startAlpha,
    endAlpha,
    background: `linear-gradient(to right, rgba(${r}, ${g}, ${b}, ${startAlpha}) 0%, rgba(${r}, ${g}, ${b}, ${endAlpha}) 100%)`,
    borderColor: `rgb(${r}, ${g}, ${b})`,
    textColor: useLightText ? "#fdfaf4" : "#231e18",
    badgeBg: `rgba(${r}, ${g}, ${b}, ${Number((0.11 + closeness * 0.2).toFixed(2))})`,
    badgeColor: `rgb(${Math.max(0, r - badgeDarken)}, ${Math.max(0, g - badgeDarken)}, ${Math.max(0, b - badgeDarken)})`,
  };
}

/**
 * True calendar width percentage (2.5..100) for a task bar stretching from Today
 * to its exact deadline on the horizon (default 90 days).
 */
function getTimelineWidthPercent(daysLeft, horizonDays = HORIZON_DAYS) {
  const horizon = horizonDays > 0 ? horizonDays : HORIZON_DAYS;
  if (daysLeft <= 0) return 2.5; // Crisp solid block right on Today
  const clamped = Math.min(horizon, daysLeft);
  const rawPercent = (clamped / horizon) * 100;
  return Math.min(100, Math.max(2.5, Number(rawPercent.toFixed(2))));
}

/**
 * Build the month markers along the horizon strip (Today + each upcoming month's 1st).
 */
function getMonthMarkers(today = new Date(), horizonDays = HORIZON_DAYS) {
  const horizon = horizonDays > 0 ? horizonDays : HORIZON_DAYS;
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const markers = [
    {
      label: "Today",
      percent: 0,
      isToday: true,
    },
  ];

  for (let offset = 1; offset <= horizon; offset++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + offset);
    if (d.getDate() === 1) {
      const percent = Number(((offset / horizon) * 100).toFixed(2));
      // Keep clean breathing room from the Today label
      if (percent >= 8 && percent <= 94) {
        markers.push({
          label: d.toLocaleDateString("en-US", { month: "short", year: d.getMonth() === 0 ? "numeric" : undefined }),
          percent,
          isToday: false,
        });
      }
    }
  }
  return markers;
}

/**
 * Count how many tasks were completed within the last 7 days.
 */
function countCompletedThisWeek(tasks, today = new Date()) {
  const sevenDaysAgo = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 6);
  return tasks.filter((t) => {
    if (t.status !== "done" || !t.completedAt) return false;
    const doneDate = parseDateKey(t.completedAt);
    return doneDate && doneDate >= sevenDaysAgo;
  }).length;
}

/**
 * Sort active tasks: soonest deadline first, then tasks without deadlines (newest first).
 */
function sortTasksByUrgency(tasks, today = new Date()) {
  return [...tasks].sort((a, b) => {
    const da = a.dueDate ? daysUntil(a.dueDate, today) : Infinity;
    const db = b.dueDate ? daysUntil(b.dueDate, today) : Infinity;
    if (da !== db) return da - db;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}

/**
 * Next due date for a repeating task, as "YYYY-MM-DD" ("" if the inputs are invalid).
 * Starts from baseDateKey, steps forward by the recurrence interval, and keeps
 * stepping until the result is strictly after today (so overdue tasks catch up).
 * Month/year steps always count from the ORIGINAL day-of-month, so Jan 31 gives
 * Feb 28 and then Mar 31 instead of drifting down to the 28th forever.
 */
function getNextRecurrenceDate(baseDateKey, recurrence, today = new Date()) {
  if (!recurrence || !VALID_RECURRENCES.includes(recurrence)) return "";
  const base = parseDateKey(baseDateKey);
  if (!base || Number.isNaN(base.getTime())) return "";
  const todayKey = toDateKey(today);

  const anchorDay = base.getDate();
  const step = (n) => {
    if (recurrence === "weekly") {
      return new Date(base.getFullYear(), base.getMonth(), base.getDate() + 7 * n);
    }
    const monthsPerStep = recurrence === "monthly" ? 1 : recurrence === "quarterly" ? 3 : 12;
    return logicAddMonthsClamped(base.getFullYear(), base.getMonth(), anchorDay, monthsPerStep * n);
  };

  let n = 1;
  let next = toDateKey(step(n));
  // Hard cap keeps a nonsense base date (year 0001) from looping forever
  while (next <= todayKey && n < 200000) {
    n += 1;
    next = toDateKey(step(n));
  }
  return next;
}

/**
 * Pull #tags out of text. Returns unique lowercase tags without the "#".
 */
function extractTags(text) {
  if (typeof text !== "string") return [];
  const re = /(?:^|\s)#([\p{L}\p{N}][\p{L}\p{N}_-]{0,29})/gu;
  const seen = new Set();
  const tags = [];
  let match;
  while ((match = re.exec(text)) !== null) {
    const tag = match[1].toLowerCase();
    if (!seen.has(tag)) {
      seen.add(tag);
      tags.push(tag);
    }
  }
  return tags;
}

/**
 * Sorted unique tags found in the titles and notes of all active (not done) tasks.
 */
function getAllTags(tasks) {
  const all = new Set();
  (tasks || []).forEach((t) => {
    if (!t || t.status === "done") return;
    extractTags(t.title).forEach((tag) => all.add(tag));
    extractTags(t.notes).forEach((tag) => all.add(tag));
  });
  return [...all].sort();
}

/**
 * Parse quick-capture shortcuts out of a title being typed:
 *   @today      -> putInToday: true (no deadline is forced)
 *   @tom / @tomorrow -> dueDate = tomorrow
 *   @+3d / @+2w / @+1m -> dueDate = today + 3 days / 2 weeks / 1 month
 * Tokens must be separated by whitespace. They are stripped from the title.
 */
function parseQuickCapture(rawTitle, today = new Date()) {
  const text = typeof rawTitle === "string" ? rawTitle : "";
  const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let dueDate = "";
  let putInToday = false;

  const kept = [];
  text.split(/\s+/).forEach((token) => {
    if (!token) return;
    if (/^@today$/i.test(token)) {
      putInToday = true;
      return;
    }
    if (/^@(tom|tomorrow)$/i.test(token)) {
      dueDate = toDateKey(new Date(startOfToday.getFullYear(), startOfToday.getMonth(), startOfToday.getDate() + 1));
      return;
    }
    const rel = /^@\+(\d{1,4})([dwm])$/i.exec(token);
    if (rel) {
      const amount = parseInt(rel[1], 10);
      const unit = rel[2].toLowerCase();
      if (unit === "m") {
        dueDate = toDateKey(
          logicAddMonthsClamped(startOfToday.getFullYear(), startOfToday.getMonth(), startOfToday.getDate(), amount)
        );
      } else {
        const days = unit === "w" ? amount * 7 : amount;
        dueDate = toDateKey(new Date(startOfToday.getFullYear(), startOfToday.getMonth(), startOfToday.getDate() + days));
      }
      return;
    }
    kept.push(token);
  });

  return { title: kept.join(" "), dueDate, putInToday };
}

function makeId(prefix = "t") {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;

/**
 * Turn any loosely-shaped saved/imported task into the full, safe task shape.
 * Returns null for anything that is not an object.
 */
function normalizeTask(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  const now = Date.now();

  const title = typeof raw.title === "string" && raw.title.trim() ? raw.title.trim() : "Untitled task";
  const status = LOGIC_VALID_STATUSES.includes(raw.status) ? raw.status : "inbox";
  const dueDate = logicIsValidDateKey(raw.dueDate) ? raw.dueDate : "";

  let previousStatus = raw.previousStatus;
  if (previousStatus !== "inbox" && previousStatus !== "today") {
    previousStatus = status === "today" ? "today" : "inbox";
  }

  const subtasks = [];
  if (Array.isArray(raw.subtasks)) {
    raw.subtasks.forEach((st) => {
      if (!st || typeof st !== "object") return;
      const text = typeof st.text === "string" ? st.text.trim() : "";
      if (!text) return;
      subtasks.push({
        id: typeof st.id === "string" && st.id ? st.id : makeId("st"),
        text,
        done: st.done === true,
      });
    });
  }

  const createdAt = Number.isFinite(raw.createdAt) && raw.createdAt > 0 ? Math.trunc(raw.createdAt) : now;
  const updatedAt = Number.isFinite(raw.updatedAt) && raw.updatedAt > 0 ? Math.trunc(raw.updatedAt) : createdAt;

  const task = {
    id: typeof raw.id === "string" && raw.id ? raw.id : makeId("t"),
    title,
    dueDate,
    status,
    previousStatus,
    notes: typeof raw.notes === "string" ? raw.notes : "",
    subtasks,
    recurrence: VALID_RECURRENCES.includes(raw.recurrence) ? raw.recurrence : "",
    recurrenceSpawnedId:
      typeof raw.recurrenceSpawnedId === "string" && raw.recurrenceSpawnedId ? raw.recurrenceSpawnedId : null,
    createdAt,
    updatedAt,
    completedAt: status === "done" && logicIsValidDateKey(raw.completedAt) ? raw.completedAt : null,
  };
  if (raw.isSample === true) task.isSample = true;
  return task;
}

/**
 * Normalize a task list, dropping non-objects and duplicate ids (first wins).
 */
function normalizeTaskList(rawList) {
  if (!Array.isArray(rawList)) return [];
  const seen = new Set();
  const out = [];
  rawList.forEach((item) => {
    const t = normalizeTask(item);
    if (!t || seen.has(t.id)) return;
    seen.add(t.id);
    out.push(t);
  });
  return out;
}

/**
 * Pure offline equivalent of server.py:update_task_with_spawn.
 * Validates all fields identically, tracks previousStatus, clears isSample,
 * and spawns the next recurring copy once on non-done -> done transitions.
 * Returns { tasks, task, spawnedTask } or null if taskId is not found.
 */
function applyTaskPatch(taskList, taskId, patch, today = new Date(), nowMs = Date.now()) {
  const list = Array.isArray(taskList) ? taskList : [];
  const idx = list.findIndex((item) => item && item.id === taskId);
  if (idx === -1) return null;

  const updates = patch && typeof patch === "object" ? patch : {};
  const existing = list[idx];
  const updated = {
    ...existing,
    subtasks: Array.isArray(existing.subtasks) ? existing.subtasks.map((s) => ({ ...s })) : [],
  };

  if (typeof updates.title === "string") {
    const trimmed = updates.title.trim();
    if (trimmed) updated.title = trimmed;
  }

  if (typeof updates.dueDate === "string") {
    const cleanDate = updates.dueDate.trim();
    if (cleanDate === "" || logicIsValidDateKey(cleanDate)) {
      updated.dueDate = cleanDate;
    }
  }

  if (typeof updates.notes === "string") {
    updated.notes = updates.notes;
  }

  if (Array.isArray(updates.subtasks)) {
    const cleanSubs = [];
    updates.subtasks.forEach((st) => {
      if (!st || typeof st !== "object") return;
      const text = typeof st.text === "string" ? st.text.trim() : "";
      if (!text) return;
      cleanSubs.push({
        id: typeof st.id === "string" && st.id ? st.id : makeId("st"),
        text,
        done: st.done === true,
      });
    });
    updated.subtasks = cleanSubs;
  }

  if (VALID_RECURRENCES.includes(updates.recurrence)) {
    updated.recurrence = updates.recurrence;
  }

  let spawnedTask = null;
  if (LOGIC_VALID_STATUSES.includes(updates.status)) {
    const oldStatus = updated.status;
    const newStatus = updates.status;
    updated.status = newStatus;

    if (newStatus === "done") {
      if (oldStatus !== "done") {
        updated.previousStatus = oldStatus === "today" ? "today" : "inbox";
        updated.completedAt = toDateKey(today);

        const existingSpawn =
          updated.recurrenceSpawnedId &&
          list.some((other) => other && other.id === updated.recurrenceSpawnedId);
        if (updated.recurrence && !existingSpawn) {
          const nextDue = getNextRecurrenceDate(
            updated.dueDate || toDateKey(today),
            updated.recurrence,
            today
          );
          if (nextDue) {
            const spawnedId = makeId("t");
            updated.recurrenceSpawnedId = spawnedId;
            spawnedTask = {
              id: spawnedId,
              title: updated.title,
              dueDate: nextDue,
              status: "inbox",
              previousStatus: "inbox",
              notes: updated.notes || "",
              subtasks: updated.subtasks.map((s) => ({
                id: makeId("st"),
                text: s.text,
                done: false,
              })),
              recurrence: updated.recurrence,
              recurrenceSpawnedId: null,
              createdAt: nowMs,
              updatedAt: nowMs,
              completedAt: null,
            };
          }
        }
      }
    } else {
      updated.completedAt = null;
      updated.previousStatus = newStatus;
      // Intentionally preserve dueDate === "" for undated Today tasks
    }
  }

  delete updated.isSample;
  updated.updatedAt = nowMs;

  const nextTasks = list.map((item, i) => (i === idx ? updated : item));
  if (spawnedTask) {
    nextTasks.unshift(spawnedTask);
  }
  return { tasks: nextTasks, task: updated, spawnedTask };
}

/**
 * Pure merge matching server.py:import_tasks(mode="merge").
 * Preserves existing order, updates an existing id only when incoming.updatedAt > existing.updatedAt,
 * and appends new tasks.
 */
function mergeTaskLists(existingList, incomingList) {
  const merged = normalizeTaskList(existingList);
  const index = new Map();
  merged.forEach((t, i) => index.set(t.id, i));

  normalizeTaskList(incomingList).forEach((inc) => {
    const i = index.get(inc.id);
    if (i === undefined) {
      index.set(inc.id, merged.length);
      merged.push(inc);
    } else if ((inc.updatedAt || 0) > (merged[i].updatedAt || 0)) {
      merged[i] = inc;
    }
  });

  return merged;
}

// --- IndexedDB Handle Persistence ---

function openHandlesDb() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB unavailable"));
      return;
    }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveHandleToIdb(handle) {
  try {
    const db = await openHandlesDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(handle, IDB_HANDLE_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    db.close();
  } catch (err) {
    console.warn("Could not persist file handle in IndexedDB:", err);
  }
}

async function loadHandleFromIdb() {
  try {
    const db = await openHandlesDb();
    const handle = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const getReq = tx.objectStore(IDB_STORE).get(IDB_HANDLE_KEY);
      getReq.onsuccess = () => resolve(getReq.result || null);
      getReq.onerror = () => reject(getReq.error);
    });
    db.close();
    return handle;
  } catch {
    return null;

}
