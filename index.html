<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Compact Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <h1>Horizon</h1>
        <span class="sep">/</span>
        <span class="meta-mono" id="today-label"></span>
        <span class="storage-tag" id="storage-tag" title="Where tasks are saved">tasks.json</span>
      </div>
      <div class="topbar-right">
        <button type="button" class="text-btn hidden" id="link-file-btn" title="Open an existing tasks.json and auto-save changes to it">Open file</button>
        <button type="button" class="text-btn hidden" id="new-file-btn" title="Create a new tasks.json file and auto-save changes to it">New file</button>
        <button type="button" class="text-btn hidden" id="clear-samples-btn">Clear samples</button>
        <button type="button" class="text-btn" id="export-btn">Export</button>
        <label class="text-btn">
          Import
          <input type="file" id="import-input" accept="application/json,.json" hidden />
        </label>
      </div>
    </header>

    <!-- Single-line Quick Capture -->
    <form id="add-task-form" class="capture-bar" aria-label="Add task">
      <input
        type="text"
        id="task-title-input"
        class="capture-input"
        placeholder="Add a task..."
        autocomplete="off"
        required
      />
      <input type="date" id="task-date-input" class="capture-date" title="Optional deadline" />
      <label class="capture-check" title="Add to Today's Focus (anchors to Today on timeline)">
        <input type="checkbox" id="task-today-input" />
        <span>Today</span>
      </label>
      <button type="submit" class="btn-add">Add</button>
    </form>

    <!-- Compact 3-Month Horizontal Calendar Stripe -->
    <section class="block timeline-block" aria-label="3-month horizon">
      <div class="block-head">
        <div class="block-title">
          <h2>3-Month Horizon</h2>
          <span class="meta-mono" id="timeline-count">0</span>
        </div>
        <div class="legend" aria-hidden="true">
          <span>90d</span>
          <span class="legend-bar"></span>
          <span>Due</span>
        </div>
      </div>

      <div class="overdue-row hidden" id="overdue-strip"></div>

      <div class="timeline-scroll">
        <div class="timeline-canvas">
          <div class="timeline-axis" id="timeline-months"></div>
          <div class="timeline-grid" id="timeline-grid"></div>
          <div class="timeline-lanes" id="timeline-lanes"></div>
        </div>
      </div>
    </section>

    <!-- Compact Two-Column Lists -->
    <main class="columns">
      <div class="col">
        <section class="block" aria-label="Today's Focus">
          <div class="block-head">
            <div class="block-title">
              <h2>Today</h2>
              <span class="meta-mono" id="today-count">0</span>
            </div>
            <span class="nudge" id="focus-nudge">1–3 focus items</span>
          </div>
          <ul class="list" id="today-list"></ul>
          <div class="empty hidden" id="today-empty">Nothing set for today.</div>
        </section>

        <section class="block" aria-label="Completed">
          <div class="block-head">
            <div class="block-title">
              <h2>Done</h2>
              <span class="meta-mono ok-text" id="wins-week-badge">0 this week</span>
            </div>
            <button type="button" class="text-btn hidden" id="clear-done-btn">Clear</button>
          </div>
          <ul class="list" id="done-list"></ul>
          <div class="empty hidden" id="done-empty">Completed tasks appear here.</div>
        </section>
      </div>

      <div class="col">
        <section class="block" aria-label="Inbox">
          <div class="block-head">
            <div class="block-title">
              <h2>Inbox</h2>
              <span class="meta-mono" id="inbox-count">0</span>
            </div>
            <div class="filters" role="group" aria-label="Filter inbox">
              <button type="button" class="filter-btn active" data-filter="all">All</button>
              <button type="button" class="filter-btn" data-filter="dated">Dated</button>
              <button type="button" class="filter-btn" data-filter="flexible">Undated</button>
            </div>
          </div>
          <ul class="list" id="inbox-list"></ul>
          <div class="empty hidden" id="inbox-empty">Inbox clear.</div>
        </section>
      </div>
    </main>
  </div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
