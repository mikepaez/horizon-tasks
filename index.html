<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Compact Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <h1>Horizon</h1>
        <span class="sep">/</span>
        <span class="meta-mono" id="today-label"></span>
        <button type="button" class="status-pill" id="storage-tag" title="Storage status">Loading...</button>
      </div>
      <div class="topbar-right">
        <button type="button" class="text-btn" id="checkin-open-btn" title="Open morning check-in">Check-in</button>
        <button type="button" class="text-btn hidden" id="reconnect-file-btn" title="Reconnect to your previously linked tasks.json">Reconnect</button>
        <button type="button" class="text-btn hidden" id="link-file-btn" title="Open an existing tasks.json and auto-save changes to it">Open file</button>
        <button type="button" class="text-btn hidden" id="new-file-btn" title="Create a new tasks.json file and auto-save changes to it">New file</button>
        <button type="button" class="text-btn hidden" id="clear-samples-btn">Clear samples</button>
        <button type="button" class="text-btn" id="export-btn">Export</button>
        <button type="button" class="text-btn" id="import-btn" title="Merge tasks from a JSON file">Import</button>
        <input type="file" id="import-input" accept="application/json,.json" class="sr-only" tabindex="-1" />
      </div>
    </header>

    <!-- System Alert / Sync Banner (priority over check-in; at most one banner at a time) -->
    <div class="system-banner hidden" id="system-banner" role="alert">
      <span id="system-banner-text"></span>
      <div class="system-banner-actions" id="system-banner-actions"></div>
    </div>

    <!-- Inline Morning Check-in Banner & 20-Second Card Stack -->
    <section class="checkin-banner hidden" id="checkin-banner" aria-label="Morning check-in"></section>

    <!-- Single-line Quick Capture + Compact Quick Chips -->
    <form id="add-task-form" class="capture-wrap" aria-label="Add task">
      <div class="capture-bar">
        <input
          type="text"
          id="task-title-input"
          class="capture-input"
          placeholder="Add a task... (!today, #personal, #tag, @tom, @+1w, @mon)"
          autocomplete="off"
          required
        />
        <input type="date" id="task-date-input" class="capture-date" aria-label="Optional deadline" title="Optional deadline" />
        <label class="capture-check" title="Add to Today's Focus (cap 3)">
          <input type="checkbox" id="task-today-input" />
          <span>Today</span>
        </label>
        <button type="submit" class="btn-add">Add</button>
      </div>
      <div class="capture-chips">
        <div class="capture-chip-group" aria-label="Quick deadlines">
          <button type="button" class="chip-btn" data-quick-date="tomorrow">Tomorrow</button>
          <button type="button" class="chip-btn" data-quick-date="+1w">+1w</button>
          <button type="button" class="chip-btn" data-quick-date="next-mon">Next Mon</button>
          <button type="button" class="chip-btn" data-quick-date="+1m">+1m</button>
        </div>
        <div class="capture-chip-group">
          <button type="button" class="chip-btn area-chip" id="capture-area-btn" title="Toggle Work / Personal (or type #personal)">Work</button>
          <span class="shortcut-hint" aria-hidden="true">N add · S start · E details · / find</span>
        </div>
      </div>
    </form>

    <!-- Optional Quick-Search Bar (press / to filter; Esc clears) -->
    <div class="search-bar hidden" id="search-bar">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Filter tasks, next steps, or waiting on... (Esc to close)"
        aria-label="Filter tasks"
        autocomplete="off"
      />
      <button type="button" class="row-btn" id="search-clear-btn" aria-label="Clear filter">×</button>
    </div>

    <!-- Lightweight #Tag Filter Strip -->
    <div class="tag-bar hidden" id="tag-bar" role="group" aria-label="Filter by tag">
      <div class="tag-chips" id="tag-chips"></div>
      <button type="button" class="text-btn clear-tag-btn hidden" id="clear-tag-btn">Clear tag</button>
    </div>

    <!-- Compact Horizontal Calendar Stripe -->
    <section class="block timeline-block" aria-label="Horizon timeline">
      <div class="block-head">
        <div class="block-title">
          <h2 id="horizon-heading">3-Month Horizon</h2>
          <span class="meta-mono" id="timeline-count">0</span>
        </div>
        <div class="horizon-head-right">
          <div class="horizon-range" id="horizon-range">
            <label class="horizon-range-label" for="horizon-days-input">View</label>
            <div class="horizon-combo">
              <input
                type="text"
                inputmode="numeric"
                id="horizon-days-input"
                class="horizon-days-input"
                value="90"
                maxlength="4"
                autocomplete="off"
                role="combobox"
                aria-label="Horizon view in days"
                aria-expanded="false"
                aria-controls="horizon-preset-menu"
                aria-autocomplete="none"
                title="Enter any number of days (1–730) or choose a preset"
              />
              <span class="horizon-days-unit" aria-hidden="true">d</span>
              <button
                type="button"
                id="horizon-preset-toggle"
                class="horizon-preset-toggle"
                aria-label="Choose horizon preset"
                aria-expanded="false"
                aria-controls="horizon-preset-menu"
                title="Quick presets"
              >▾</button>
              <div class="horizon-preset-menu hidden" id="horizon-preset-menu" role="listbox" aria-label="Horizon presets">
                <button type="button" class="horizon-preset-option" role="option" data-horizon="7"><span>7d</span><span class="preset-hint">1 week</span></button>
                <button type="button" class="horizon-preset-option" role="option" data-horizon="14"><span>14d</span><span class="preset-hint">2 weeks</span></button>
                <button type="button" class="horizon-preset-option" role="option" data-horizon="30"><span>30d</span><span class="preset-hint">1 month</span></button>
                <button type="button" class="horizon-preset-option" role="option" data-horizon="90"><span>90d</span><span class="preset-hint">3 months</span></button>
                <button type="button" class="horizon-preset-option" role="option" data-horizon="180"><span>180d</span><span class="preset-hint">6 months</span></button>
                <button type="button" class="horizon-preset-option" role="option" data-horizon="365"><span>365d</span><span class="preset-hint">1 year</span></button>
              </div>
            </div>
          </div>
          <div class="legend" aria-hidden="true">
            <span id="legend-horizon-label">90d</span>
            <span class="legend-bar"></span>
            <span>Due</span>
          </div>
        </div>
      </div>

      <div class="overdue-row hidden" id="overdue-strip"></div>

      <div class="timeline-scroll">
        <div class="timeline-canvas">
          <div class="timeline-axis" id="timeline-months"></div>
          <div class="timeline-grid" id="timeline-grid"></div>
          <div class="timeline-lanes" id="timeline-lanes"></div>
          <div class="timeline-beyond-note hidden" id="timeline-beyond"></div>
        </div>
      </div>

      <div class="section-foot hidden" id="timeline-foot">
        <button type="button" class="text-btn show-more-btn" id="timeline-more-btn"></button>
      </div>

      <!-- Inline quick-actions strip when a timeline bar is clicked -->
      <div class="timeline-inspector hidden" id="timeline-inspector"></div>
    </section>

    <!-- Compact Two-Column Lists (3 zones: Today, Later + Waiting, Done) -->
    <main class="columns">
      <div class="col">
        <section class="block" aria-label="Today's Focus">
          <div class="block-head">
            <div class="block-title">
              <h2>Today</h2>
              <span class="meta-mono" id="today-count">0/3</span>
            </div>
            <div class="head-right">
              <span class="nudge" id="focus-nudge">Focus cap: 3</span>
              <button type="button" class="text-btn hidden" id="end-day-btn" title="Check that started tasks have a 'where I left off' note">End day</button>
            </div>
          </div>
          <div class="swap-prompt hidden" id="today-swap-prompt"></div>
          <ul class="list" id="today-list"></ul>
          <div class="empty hidden" id="today-empty">Nothing set for today.</div>
        </section>

        <section class="block" aria-label="Completed">
          <div class="block-head">
            <div class="block-title">
              <h2>Done</h2>
              <span class="meta-mono ok-text" id="wins-week-badge">0 this week</span>
            </div>
            <button type="button" class="text-btn hidden" id="clear-done-btn">Clear</button>
          </div>
          <ul class="list" id="done-list"></ul>
          <button type="button" class="text-btn show-more-btn hidden" id="done-more-btn"></button>
          <div class="empty hidden" id="done-empty">Completed tasks appear here.</div>
        </section>
      </div>

      <div class="col">
        <section class="block" aria-label="Later">
          <div class="block-head">
            <div class="block-title">
              <h2>Later</h2>
              <span class="meta-mono" id="later-count">0</span>
            </div>
            <div class="filters" role="group" aria-label="Filter later list">
              <button type="button" class="filter-btn active" data-filter="all">All</button>
              <button type="button" class="filter-btn" data-filter="dated">Dated</button>
              <button type="button" class="filter-btn" data-filter="flexible">Undated</button>
            </div>
          </div>
          <ul class="list" id="later-list"></ul>
          <div class="empty hidden" id="later-empty">Nothing waiting in Later.</div>

          <!-- Collapsible Waiting On group tucked inside Later -->
          <div class="waiting-section hidden" id="waiting-section">
            <button type="button" class="waiting-toggle" id="waiting-toggle" aria-expanded="false">
              <span id="waiting-toggle-label">Waiting on (0)</span>
              <span class="meta-mono" id="waiting-chevron">▸</span>
            </button>
            <ul class="list hidden" id="waiting-list"></ul>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Non-blocking Undo / Status Toast -->
  <div class="toast hidden" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button type="button" class="toast-btn hidden" id="toast-undo-btn">Undo</button>
    <button type="button" class="toast-close" id="toast-close-btn" aria-label="Dismiss">×</button>
  </div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
