<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <!-- Compact Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <h1>Horizon</h1>
        <span class="sep">/</span>
        <span class="meta-mono" id="today-label"></span>
        <span class="storage-tag" id="storage-tag" title="Where tasks are saved">tasks.json</span>
        <button
          type="button"
          class="reconnect-btn hidden"
          id="reconnect-file-btn"
          title="Click to grant permission and resume auto-saving to your linked file"
        ></button>
      </div>
      <div class="topbar-right">
        <button type="button" class="text-btn hidden" id="link-file-btn" title="Open an existing tasks.json and auto-save changes to it">Open file</button>
        <button type="button" class="text-btn hidden" id="new-file-btn" title="Create a new tasks.json file and auto-save changes to it">New file</button>
        <button type="button" class="text-btn hidden" id="clear-samples-btn">Clear samples</button>
        <button type="button" class="text-btn" id="export-btn">Export</button>
        <label class="text-btn">
          Import
          <input type="file" id="import-input" accept="application/json,.json" hidden />
        </label>
      </div>
    </header>

    <!-- External File / Sync Conflict Banner -->
    <div class="paper-banner conflict-banner hidden" id="conflict-banner" role="alert">
      <span class="banner-msg" id="conflict-banner-text">tasks.json changed outside this tab</span>
      <div class="banner-actions">
        <button type="button" class="banner-btn" id="conflict-reload-btn">Reload from disk</button>
        <button type="button" class="banner-btn is-primary" id="conflict-overwrite-btn">Keep my version &amp; overwrite</button>
      </div>
    </div>

    <!-- Safe Import Confirmation Banner -->
    <div class="paper-banner import-banner hidden" id="import-banner" role="region" aria-label="Import options">
      <span class="banner-msg" id="import-banner-text"></span>
      <div class="banner-actions">
        <button type="button" class="banner-btn is-primary" id="import-merge-btn">Merge with existing</button>
        <button type="button" class="banner-btn is-danger" id="import-replace-btn">Replace all</button>
        <button type="button" class="banner-btn" id="import-cancel-btn">Cancel</button>
      </div>
    </div>

    <!-- Single-line Quick Capture -->
    <form id="add-task-form" class="capture-bar" aria-label="Add task">
      <input
        type="text"
        id="task-title-input"
        class="capture-input"
        placeholder="Add a task... (try #tag, @tom, @+1w)"
        autocomplete="off"
        required
      />
      <div class="quick-date-pills" role="group" aria-label="Quick deadline">
        <button type="button" class="quick-pill" data-quick-date="tom" title="Set deadline to tomorrow">Tom</button>
        <button type="button" class="quick-pill" data-quick-date="1w" title="Set deadline to +1 week">+1w</button>
        <button type="button" class="quick-pill" data-quick-date="1m" title="Set deadline to +1 month">+1m</button>
      </div>
      <input type="date" id="task-date-input" class="capture-date" title="Optional deadline" />
      <label class="capture-check" title="Add to Today's Focus (anchors to Today on timeline)">
        <input type="checkbox" id="task-today-input" />
        <span>Today</span>
      </label>
      <button type="submit" class="btn-add">Add</button>
    </form>

    <!-- Lightweight Search & #Tag Filter Bar -->
    <div class="filter-bar" id="filter-bar" role="search" aria-label="Search and filter tasks">
      <div class="search-box">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search tasks..."
          title="Filter timeline and lists (press / to focus)"
          autocomplete="off"
        />
        <button type="button" class="search-clear-btn hidden" id="search-clear-btn" aria-label="Clear search">×</button>
      </div>
      <div class="tag-chips hidden" id="tag-chips" role="group" aria-label="Filter by tag"></div>
      <button type="button" class="text-btn clear-filters-btn hidden" id="clear-filters-btn">Clear filter</button>
    </div>

    <!-- Compact Horizontal Calendar Stripe -->
    <section class="block timeline-block" aria-label="Horizon timeline">
      <div class="block-head">
        <div class="block-title">
          <h2 id="horizon-heading">3-Month Horizon</h2>
          <span class="meta-mono" id="timeline-count">0</span>
        </div>
        <div class="horizon-head-right">
          <div class="zoom-switcher" role="group" aria-label="Horizon zoom">
            <button type="button" class="zoom-btn" data-horizon="30">30d</button>
            <button type="button" class="zoom-btn active" data-horizon="90">90d</button>
            <button type="button" class="zoom-btn" data-horizon="180">180d</button>
          </div>
          <div class="legend" aria-hidden="true">
            <span id="legend-horizon-label">90d</span>
            <span class="legend-bar"></span>
            <span>Due</span>
          </div>
        </div>
      </div>

      <div class="overdue-row hidden" id="overdue-strip"></div>

      <div class="timeline-scroll">
        <div class="timeline-canvas">
          <div class="timeline-axis" id="timeline-months"></div>
          <div class="timeline-grid" id="timeline-grid"></div>
          <div class="timeline-lanes" id="timeline-lanes"></div>
          <div class="timeline-beyond-note hidden" id="timeline-beyond"></div>
        </div>
      </div>

      <div class="section-foot hidden" id="timeline-foot">
        <button type="button" class="text-btn show-more-btn" id="timeline-more-btn"></button>
      </div>
    </section>

    <!-- Compact Two-Column Lists -->
    <main class="columns">
      <div class="col">
        <section class="block" aria-label="Today's Focus">
          <div class="block-head">
            <div class="block-title">
              <h2>Today</h2>
              <span class="meta-mono" id="today-count">0</span>
            </div>
            <span class="nudge" id="focus-nudge">1–3 focus items</span>
          </div>
          <ul class="list" id="today-list"></ul>
          <div class="empty hidden" id="today-empty">Nothing set for today.</div>
        </section>

        <section class="block" aria-label="Completed">
          <div class="block-head">
            <div class="block-title">
              <h2>Done</h2>
              <span class="meta-mono ok-text" id="wins-week-badge">0 this week</span>
            </div>
            <button type="button" class="text-btn hidden" id="clear-done-btn">Clear</button>
          </div>
          <ul class="list" id="done-list"></ul>
          <div class="empty hidden" id="done-empty">Completed tasks appear here.</div>
          <div class="section-foot hidden" id="done-foot">
            <button type="button" class="text-btn show-more-btn" id="done-more-btn"></button>
          </div>
        </section>
      </div>

      <div class="col">
        <section class="block" aria-label="Inbox">
          <div class="block-head">
            <div class="block-title">
              <h2>Inbox</h2>
              <span class="meta-mono" id="inbox-count">0</span>
            </div>
            <div class="filters" role="group" aria-label="Filter inbox">
              <button type="button" class="filter-btn active" data-filter="all">All</button>
              <button type="button" class="filter-btn" data-filter="dated">Dated</button>
              <button type="button" class="filter-btn" data-filter="flexible">Undated</button>
            </div>
          </div>
          <ul class="list" id="inbox-list"></ul>
          <div class="empty hidden" id="inbox-empty">Inbox clear.</div>
        </section>
      </div>
    </main>
  </div>

  <!-- Non-blocking Floating Paper Toast -->
  <div class="toast hidden" id="undo-toast" role="status" aria-live="polite">
    <span class="toast-msg" id="toast-msg"></span>
    <button type="button" class="toast-undo-btn" id="toast-undo-btn">Undo</button>
    <button type="button" class="toast-dismiss-btn" id="toast-dismiss-btn" aria-label="Dismiss notification">×</button>
  </div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
